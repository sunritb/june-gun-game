name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check source modules
        run: |
          set -e
          for f in src/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Build the playable bundle
        run: node build.mjs

      - name: Verify bundle output
        run: |
          test -s bundle/game.js && echo "bundle/game.js OK ($(wc -c < bundle/game.js) bytes)"
